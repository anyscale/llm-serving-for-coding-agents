# service-nvfp4.yaml — DEFAULT deployment (NVFP4 weights + MTP).
#
# NVFP4 4-bit weights beat FP8 in both regimes (notes/BENCHMARKS.md §7), and MTP is left ON by default
# because it maximizes single-stream decode (NVFP4+MTP = 121 tok/s, the fastest config). Same 1× RTX PRO 6000
# always-on shape as service-always-on.yaml, but:
#   - image is built from Containerfile.nvfp4 (ray-llm 2.56.1 / cu13, required for the FP4 kernels)
#   - ENABLE_NVFP4_WEIGHT=1 selects the NVFP4 *weight* checkpoint (KV stays fp8; text-only). MTP stays on.
#
# ⚠ HIGH-CONCURRENCY HEADS-UP: MTP's draft/verify overhead LOWERS aggregate throughput once many users
# saturate the GPU (§7: ~-32% out tok/s at C=16). For a heavily-concurrent deployment either use
# service-nvfp4-highconc.yaml (MTP off — also faster scale-up via the prebuilt compile cache) or try vLLM
# dynamic speculative decoding (auto-disables SD under load):
# https://docs.vllm.ai/en/stable/features/speculative_decoding/dynamic_speculative_decoding/
# NOTE: NVFP4+MTP is a distinct compile graph with no prebuilt cache, so the first replica cold-compiles.
#
# Deploy from the part3-optimize/ directory (containerfile: and working_dir: resolve against the CLI's CWD):
#   anyscale service deploy -f service-nvfp4.yaml --working-dir .
name: qwen3-6-27b-nvfp4-rtxpro6000-always-on
# Builds ray-llm 2.56.1 + vLLM 0.23.0 from Containerfile.nvfp4 at deploy time.
# Alternative: pre-build once (`anyscale image build -f Containerfile.nvfp4 -n qwen3-nvfp4 -r 2.56.1`) and
# set image_uri instead.
containerfile: Containerfile.nvfp4
# Direct-streaming flags (controller-level) + ENABLE_NVFP4_WEIGHT so the serve app selects the NVFP4 weights.
env_vars:
  RAY_SERVE_ENABLE_HA_PROXY: "1"
  RAY_SERVE_LLM_ENABLE_DIRECT_STREAMING: "1"
  ENABLE_NVFP4_WEIGHT: "1"
compute_config:
  worker_nodes:
    # AWS g7e.4xlarge = 1× NVIDIA RTX PRO 6000 96GB (Blackwell SM120), 16 vCPU, 128 GiB host RAM; TP=1.
    - instance_type: g7e.4xlarge
      min_nodes: 1                 # always-on baseline; keeps one GPU node warm
      max_nodes: 4                 # autoscale headroom (matches max_replicas=4)
working_dir: .
applications:
  - import_path: serve_qwen3_6_27b_optimized:app
