# service_naive.yaml — the NAIVE baseline. 4x L4, single replica.
# Exposes native /v1/chat/completions + /v1/messages + /v1/responses via DIRECT STREAMING
# (see ../part2-connect-clients-production/). Direct streaming needs two flags in the Ray Serve
# *controller's* environment; set them as SERVICE-LEVEL env_vars (below) — Anyscale applies these
# cluster-wide, so the controller inherits them. (A per-deployment runtime_env
# reaches only the replicas, not the controller, so the deploy would fail "ingress_request_router
# requires HAProxy".) Validated 2026-06-30: all three native endpoints return HTTP 200.
# Deploy only to compare against the optimized version; not for production.
name: qwen3-6-27b-fp8-naive
# Stock Anyscale base image, public on Docker Hub (pullable with no creds): ray-llm 2.57.0 + vLLM 0.25.1,
# which accepts Claude Code's /v1/messages schema natively — no custom image needed for the baseline.
# If your Anyscale cloud can't pull from Docker Hub, `anyscale image build` it once and use that image_uri.
image_uri: anyscale/ray-llm:2.57.0-py312-cu130
env_vars:
  RAY_SERVE_ENABLE_HA_PROXY: "1"               # cluster-level → reaches the Serve controller (enables HAProxy)
  RAY_SERVE_LLM_ENABLE_DIRECT_STREAMING: "1"   # exposes vLLM's native /v1/messages + /v1/responses
compute_config:
  worker_nodes:
    # AWS g6.12xlarge = 4x NVIDIA L4 (24 GB each), 48 vCPU, 192 GiB host RAM; TP=4 over PCIe (no NVLink).
    # A common, widely-available GPU shape — used here as the un-optimized baseline. Part 3 moves to
    # 1x RTX PRO 6000 96GB (g7e.4xlarge, TP=1), where the weights fit on a single GPU.
    - instance_type: g6.12xlarge
      min_nodes: 1
      max_nodes: 1                 # single replica, no autoscaling
working_dir: .
applications:
  - import_path: serve_qwen3_6_27b_naive:app
